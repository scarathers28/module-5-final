<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/fb1eafcf24.js" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
    <div id="app">
        <div class="flex felx-col" style="display: flex; flex: 1 1 0%;">
            <div class="navbar flex flex-col">
                <div class="flex content-wrapper justify-between align-center" style="flex-direction: row; z-index: 1005;">
                    <div class="logo">
                        <img src="./assets/whitelogo.39850b27.png" alt="blinker logo" class="logo">
                    </div>
                    <div class="links flex align-center justify-between">
                        <a href="#" class="link router-link-active">Home</a>
                        <a href="#" class="link router-link-exact-active router-link-active">Find your movie</a>
                        <a href="#" class="btn-contact">Contact</a>
                    </div>
                </div>
                <div class="content-wrapper flex-col align-center" style="margin-top: 40px;">
                    <h1>Browse our movies</h1>
                    <div class="input-wrap">
                        <input type="text" placeholder="Search by Title or Keyword">
                        <div class="search-wrapper flex justify-center align-center">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>
                </div>
                <div class="overlay">
                    <img src="./assets/ai-generated-film-reel-spinning-on-a-projector-generative-ai-photo.jpeg">
                </div>
            </div>
            <section id="search">
                <div id="filter" class="content-wrapper justify-between">
                    <h1 class="search-info"><span class=black-txt">Search results:</span></h1>
                    <div class="alpha-order flex flex-col">
                        <h2><span class=black-txt">Sort by:</span>" A to Z "</h2>
                    </div>
                </div>
                <div id="movies">
                    <div class="content-wrapper">
                        <div class="loading-state flex justify-center">
                            <i class="fa-solid fa-spinner"></i>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
